name: CI Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install textual "yt-dlp[default]" pytest

      # The suite in test_yt_sync.py covers the regression tests, the diff
      # performance budget, batch responsiveness, layout, view cache and mouse
      # restyle guards. The legacy test_perf.py / test_responsiveness.py are
      # superseded by those classes and do not collect under pytest 9 +
      # pytest-benchmark 5 (benchmark fixture uses the removed Node._nodeid).
      - name: Run Tests
        run: |
          python -m pytest ytsync/test_yt_sync.py
